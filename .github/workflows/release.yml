name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates/updates tag vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (Apple Silicon / arm64)
        run: |
          xcodebuild \
            -project DragonKControl.xcodeproj \
            -scheme DragonKControl \
            -configuration Release \
            -derivedDataPath build/arm64 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            build

      - name: Build (Intel / x86_64)
        run: |
          xcodebuild \
            -project DragonKControl.xcodeproj \
            -scheme DragonKControl \
            -configuration Release \
            -derivedDataPath build/x86_64 \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            build

      - name: Package artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/arm64/Build/Products/Release/DragonKControl.app" \
            "dist/DragonKControl-${VERSION}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/x86_64/Build/Products/Release/DragonKControl.app" \
            "dist/DragonKControl-${VERSION}-x86_64.zip"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DragonKControl v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            macOS 13+。未经 Apple 公证，首次打开需在「系统设置 → 隐私与安全性」允许，或执行 `xattr -cr DragonKControl.app`。

            - `DragonKControl-${{ steps.version.outputs.version }}-arm64.zip`：Apple Silicon（M 系列）
            - `DragonKControl-${{ steps.version.outputs.version }}-x86_64.zip`：Intel
          files: |
            dist/DragonKControl-${{ steps.version.outputs.version }}-arm64.zip
            dist/DragonKControl-${{ steps.version.outputs.version }}-x86_64.zip
            dist/SHA256SUMS.txt
